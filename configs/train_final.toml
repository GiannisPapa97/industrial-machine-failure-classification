# Train the chosen final model on the training rows: the same as `uv run mf train`.
model = "random_forest"
feature_set = "all"
tuned = true
# threshold = 0.475  # left out: the tuned model's own threshold is used
output_path = "models/final_model.joblib"

# The train/test split is fixed for the project and is not a setting.
[data]
path = "data/raw/ai4i2020.csv"

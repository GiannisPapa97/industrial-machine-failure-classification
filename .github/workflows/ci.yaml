name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the coverage comment
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest

      - name: Coverage summary
        run: |
          {
            echo "### Coverage"
            echo
            uv run coverage report --format=markdown
          } > "$RUNNER_TEMP/coverage.md"
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"

      # Forked PRs get a read-only token, so only comment on same-repo PRs.
      - name: Coverage comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/coverage.md"
          --edit-last --create-if-none

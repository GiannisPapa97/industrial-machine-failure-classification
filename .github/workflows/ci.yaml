name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the coverage comment
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest -m "not integration"

      - name: Coverage summary
        run: |
          {
            echo "### Coverage"
            echo
            uv run coverage report --format=markdown
          } > "$RUNNER_TEMP/coverage.md"
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"

      # Forked PRs get a read-only token, so only comment on same-repo PRs.
      - name: Coverage comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/coverage.md"
          --edit-last --create-if-none

  # Runs the real workflows on the real dataset and compares the results with the
  # recorded numbers, so a refactoring that changes a result is caught. It is a
  # separate job because it downloads the dataset and takes several minutes.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache the dataset
        uses: actions/cache@v6.1.0
        with:
          path: data/raw/ai4i2020.csv
          key: dataset-ai4i2020-${{ hashFiles('src/machine_failure/data.py') }}

      # Skips the download when the cache already restored the file.
      - name: Download the dataset
        run: uv run python -m machine_failure.data

      # A skipped test counts as a pass, so fail loudly if the dataset is missing.
      - name: Check that the dataset is present
        run: |
          if [ ! -f data/raw/ai4i2020.csv ]; then
            echo "::error::The dataset is missing, so the integration tests would be skipped."
            exit 1
          fi

      - name: Integration tests
        run: uv run pytest -m integration --no-cov

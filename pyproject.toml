[project]
name = "industrial-machine-failure-classification"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "ucimlrepo>=0.0.7",
    "xgboost-cpu>=3.4.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "machine_failure"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --strict-markers --import-mode=importlib"
markers = [
    "integration: runs the real workflows on the downloaded dataset",
    "slow: takes more than about 30 seconds",
]

[tool.coverage.run]
source = ["machine_failure"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# X / X_train are the standard names for feature matrices in scikit-learn code
ignore = ["N803", "N806"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# Name modules by their path, so tests/conftest.py and tests/integration/conftest.py
# are different modules (tests.conftest and tests.integration.conftest).
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["ucimlrepo", "sklearn", "sklearn.*", "joblib"]
ignore_missing_imports = true
